<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
    <!-- Black calculator body -->
    <rect
        x="10"
        y="7"
        width="44"
        height="50"
        rx="12"
        fill="#050505"
        stroke="#FFD600"
        stroke-width="3"
    />

    <!-- Planet -->
    <circle
        cx="31"
        cy="23"
        r="6"
        fill="#FFD600"
    />

    <!-- Orbit around the planet -->
    <ellipse
        cx="31"
        cy="23"
        rx="16"
        ry="8"
        fill="none"
        stroke="#FFD600"
        stroke-width="2"
        transform="rotate(-20 31 23)"
    />

    <!-- Calculator buttons -->
    <circle cx="23" cy="40" r="3" fill="#FFD600"/>
    <circle cx="31" cy="40" r="3" fill="#FFD600"/>
    <circle cx="39" cy="40" r="3" fill="#FFD600"/>

    <circle cx="23" cy="48" r="3" fill="#FFD600"/>
    <rect x="28" y="45" width="14" height="6" rx="3" fill="#FFD600"/>
</svg>